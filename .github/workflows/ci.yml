@'
name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  python-only:
    # Only 3.12 is tested: requirements.txt pins the exact versions the report
    # was produced with, and those pins do not resolve on 3.10. The package
    # itself declares looser bounds in pyproject.toml and should work on
    # earlier versions with earlier numpy/pandas, but that is not claimed here
    # because it is not tested.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Test
        run: pytest tests -v

  against-r:
    # The comparison the project is actually about: run ChainLadder in R, then
    # check the Python implementation against its output.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4.1"
          # Serves precompiled Linux binaries, so ChainLadder and its
          # dependencies install in under a minute instead of compiling.
          use-public-rspm: true

      - name: Install ChainLadder
        # Installed directly rather than through setup-r-dependencies, which
        # expects an R package DESCRIPTION in the repository root; this project
        # is a Python package with one R script in it.
        run: |
          Rscript -e 'install.packages("ChainLadder")'
          Rscript -e 'stopifnot(requireNamespace("ChainLadder", quietly = TRUE)); cat("ChainLadder", as.character(packageVersion("ChainLadder")), "\n")'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python side
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Generate reference output from R
        run: Rscript R/export_reference.R reference/generated

      - name: Show what R produced
        run: |
          cat reference/generated/SESSION.txt
          ls -l reference/generated

      - name: Guard against a silently missing reference
        # tests/test_against_r.py skips when these files are absent, so a
        # missing reference would otherwise look like a green run.
        run: |
          for f in raa_triangle.csv raa_Mack_byorigin.csv raa_Mack_totals.csv \
                   raa_Mack_factors.csv genins_Mack_byorigin.csv; do
            test -s "reference/generated/$f" || { echo "missing $f"; exit 1; }
          done

      - name: Compare Python against R
        run: pytest tests -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-output
          path: reference/generated
          if-no-files-found: warn
